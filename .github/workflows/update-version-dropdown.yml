name: Update Version Dropdown in Issue Form
# Least-privilege: only needs to push the updated issue template file.
permissions:
  contents: write
on:
  push:
    tags:
      - '*'
  workflow_dispatch: {}
  release:
    types:
      - published

concurrency:
  group: update-version-dropdown-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  update-dropdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch tags
        run: git fetch --tags

      - name: Get latest versions with placeholder
        id: tags
        run: |
          TAGS=$(
            {
              git tag --merged HEAD --list --sort=-creatordate 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 3
              git tag --merged HEAD --list --sort=-creatordate 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-' | head -n 5
            } |
            jq -R -s -c 'split("\n")[:-1]')
          VERSIONS=$(echo '["Select a version"]' | jq -c --argjson tags "$TAGS" '. + $tags')
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

      - name: Issue Forms Dropdown Options
        uses: ShaMan123/gha-form-dropdown-options@124b08a39f06a6a4fcafdec501ecaca8db019db2 # v2.1.0
        with:
          form: .github/ISSUE_TEMPLATE/1-bug-report-form.yml
          dropdown: version
          options: ${{ steps.tags.outputs.versions }}

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          if git diff --quiet; then
            echo "No changes to commit."
          else
            BRANCH="${{ github.event.repository.default_branch }}"
            git stash
            git pull --rebase origin "$BRANCH"
            git stash pop || true
            git add .github/ISSUE_TEMPLATE/1-bug-report-form.yml
            git commit -m "Update issue form version dropdown with placeholder and latest tags"

            for attempt in 1 2 3; do
              if git push origin "HEAD:$BRANCH"; then
                exit 0
              fi

              if [ "$attempt" = 3 ]; then
                echo "Failed to push after $attempt attempts."
                exit 1
              fi

              git fetch origin "$BRANCH"
              git rebase --empty=drop --strategy-option=theirs "origin/$BRANCH"
            done
          fi
