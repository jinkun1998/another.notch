name: "Release Tagged Version"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and republish
        required: true
        type: string

concurrency:
  group: release-tag-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate_tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
    steps:
      - id: validate
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release tags must use vX.X.X or vX.X.X-prerelease.N, received $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([[ "$TAG" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build release
    needs: validate_tag
    permissions:
      contents: write
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: refs/tags/${{ needs.validate_tag.outputs.tag }}
      version: ${{ needs.validate_tag.outputs.version }}
      build_number: ${{ github.run_number }}
      code_sign_identity: "Apple Development: quocthao23061998.tg@icloud.com (XW87KZT6AP)"
      persist_version_changes: false
    secrets:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

  publish:
    name: Publish DMG
    needs: [validate_tag, build]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate_tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anotherNotch.dmg
          path: Release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate_tag.outputs.tag }}
          IS_PRERELEASE: ${{ needs.validate_tag.outputs.is_prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Release/anotherNotch.dmg --clobber
          else
            RELEASE_FLAGS=()
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              RELEASE_FLAGS=(--prerelease)
            fi
            gh release create "$TAG" Release/anotherNotch.dmg \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi

      - name: Create embedded release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate_tag.outputs.tag }}
        run: |
          RAW_NOTES="$(gh release view "$TAG" --json body --jq .body)"
          gh api markdown -f text="$RAW_NOTES" > Release/anotherNotch.html

      - name: Build Sparkle generate_appcast from source
        run: |
          set -euo pipefail
          SPARKLE_METADATA_PATH="anotherNotch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          SPARKLE_SRC="$RUNNER_TEMP/Sparkle"
          SPARKLE_DERIVED="$RUNNER_TEMP/sparkle-derived"
          SPARKLE_REPO_URL="https://github.com/sparkle-project/Sparkle"

          IFS=$'\t' read -r SPARKLE_VERSION SPARKLE_REVISION <<< "$(python3 - "$SPARKLE_METADATA_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text())
          sparkle = next((pin for pin in data.get("pins", []) if pin.get("identity") == "sparkle"), None)
          if sparkle is None:
              print(f"::error::No 'sparkle' pin found in {path}", file=sys.stderr)
              sys.exit(1)

          state = sparkle.get("state", {})
          version = state.get("version")
          revision = state.get("revision")
          if not version or not revision:
              print(f"::error::Sparkle pin in {path} must include version and revision", file=sys.stderr)
              sys.exit(1)

          print(f"{version}\t{revision}")
          PY
          )"

          SPARKLE_TAG=""
          for candidate in "$SPARKLE_VERSION" "v$SPARKLE_VERSION"; do
            if git ls-remote --exit-code --tags "$SPARKLE_REPO_URL" "refs/tags/$candidate" >/dev/null; then
              SPARKLE_TAG="$candidate"
              break
            fi
          done
          [[ -n "$SPARKLE_TAG" ]] || { echo "::error::Could not find Sparkle tag $SPARKLE_VERSION"; exit 1; }

          git clone --depth 1 --branch "$SPARKLE_TAG" --single-branch "$SPARKLE_REPO_URL" "$SPARKLE_SRC"
          [[ "$(git -C "$SPARKLE_SRC" rev-parse HEAD)" == "$SPARKLE_REVISION" ]] || {
            echo "::error::Sparkle tag $SPARKLE_TAG does not match the pinned revision"; exit 1;
          }

          xcodebuild -project "$SPARKLE_SRC/Sparkle.xcodeproj" \
            -scheme generate_appcast \
            -configuration Release \
            -derivedDataPath "$SPARKLE_DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build

          install -m 0755 \
            "$SPARKLE_DERIVED/Build/Products/Release/generate_appcast" \
            "$RUNNER_TEMP/generate_appcast"

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate_tag.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          APPCAST_ARGS=(
            --ed-key-file -
            --link "${{ github.server_url }}/${{ github.repository }}/releases"
            --download-url-prefix "${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/"
            --embed-release-notes
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            APPCAST_ARGS+=(--channel beta)
          fi
          APPCAST_ARGS+=(-o updater/appcast.xml Release/)
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/generate_appcast" \
            "${APPCAST_ARGS[@]}"

      - name: Commit appcast
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.validate_tag.outputs.tag }}
        run: |
          set -euo pipefail
          cp updater/appcast.xml "$RUNNER_TEMP/appcast.xml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global credential.https://github.com.helper \
            "!f() { echo \"username=x-access-token\"; printf \"password=%s\\n\" \"\${GITHUB_TOKEN}\"; }; f"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/appcast.xml" updater/appcast.xml
          git add updater/appcast.xml
          git commit -m "Update appcast for ${TAG}" || true
          git push origin main
