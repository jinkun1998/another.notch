name: "Release Tagged Version"

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-tag-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate_tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
    steps:
      - id: validate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Release tags must use vX.X.X or vX.X.X-prerelease.N, received $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$([[ "$TAG" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build release
    needs: validate_tag
    permissions:
      contents: write
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ github.ref }}
      version: ${{ needs.validate_tag.outputs.version }}
      build_number: ${{ github.run_number }}
      code_sign_identity: ${{ vars.CODE_SIGN_IDENTITY || 'Apple Development' }}
      persist_version_changes: false
    secrets:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

  publish:
    name: Publish DMG
    needs: [validate_tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: AnotherNotch.dmg
          path: Release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate_tag.outputs.is_prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Release/AnotherNotch.dmg --clobber
          else
            RELEASE_FLAGS=()
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              RELEASE_FLAGS=(--prerelease)
            fi
            gh release create "$TAG" Release/AnotherNotch.dmg \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              "${RELEASE_FLAGS[@]}"
          fi
